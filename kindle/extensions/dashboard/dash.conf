# Địa chỉ server (máy tính / Raspberry Pi trong cùng mạng Wi-Fi)
SERVER_URL="http://192.168.1.10:8080/dashboard.png"
# Số phút giữa 2 lần làm mới
REFRESH_MIN=10
# Bao nhiêu lần làm mới thì full refresh 1 lần (xoá bóng mờ e-ink)
FULL_REFRESH_EVERY=6
# 1 = ngủ sâu giữa các lần làm mới (pin trâu hơn nhiều). 0 = chỉ sleep thường.
DEEP_SLEEP=1
# RTC dùng để hẹn giờ thức dậy. PW2 thường là /dev/rtc1, nếu không chạy thử rtc0.
RTC_DEV=/dev/rtc1
# Dưới mức pin này sẽ hiện cảnh báo sạc và ngừng hẳn
LOW_BATTERY=5
