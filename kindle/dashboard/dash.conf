# ===== Kindle Dashboard =====
# Để trống SERVER_URL = Kindle TỰ vẽ. Điền URL = tải ảnh PNG từ server.
SERVER_URL=""

CITY="TP. Hồ Chí Minh"
LAT=10.8231
LON=106.6297

# Lịch Apple (iCloud): Lịch > chuột phải lịch > Chia sẻ > Lịch công khai > sao chép link.
# Nhiều lịch: cách nhau bằng dấu cách. Gắn nhãn: CV=webcal://...  GĐ=webcal://...
# Để trống = hiện todo.txt thay cho lịch.
ICS_URL=""
DAYS_AHEAD=14
# Lệch múi giờ so với UTC tính bằng phút (Việt Nam = 420)
TZ_OFFSET_MIN=420

# Ảnh: đặt PNG đã chuẩn bị (tools/prepare_photos.py) vào dashboard/photos/
# Đổi ảnh mỗi N phút. Không có ảnh thì danh sách sự kiện chiếm cả chiều ngang.
PHOTO_MIN=60

# Làm mới màn hình mỗi N phút. Thời tiết / lịch lấy lại mỗi N phút.
REFRESH_MIN=1
WEATHER_MIN=30
CALENDAR_MIN=30
# ----- Giao diện (đổi ngay trên máy: Cài đặt > Giao diện…) -----
# Bố cục: codien | toigian | thuysi | the | anh | chu | lich  (bố cục mới chỉ dùng khi màn hình dọc)
LAYOUT=codien
# auto = theo bố cục. Đồng hồ: mong dam mono lat kimtg vong chu so12 so24 kim
CLOCK_STYLE=auto
# Sự kiện: danhsach gon moc baygio tuan cham dongtg cau
EVENT_STYLE=auto
# Ảnh: tran polaroid tron nhan bia  (cần chạy lại them-anh.command để có đủ cỡ ảnh)
PHOTO_STYLE=auto
# Tiết kiệm pin: tắt Wi-Fi giữa các lần tải (1 = bật). Tắt đèn nền khi đang ở màn hình "vắng mặt" (toilet, ra ngoài...)
WIFI_SAVE=1
STATUS_DIM=1
# Tắt đèn nền sau N phút không chạm (0 = không tắt). Đang sạc thì không tắt.
LIGHT_IDLE_MIN=30
# ----- Tự động & điều khiển (đổi trong Cài đặt) -----
# Tự đổi giao diện theo giờ: 0 | lamviec | hoctap | giadinh | tuychinh (sửa dashboard/lich-giao-dien.txt)
SCHEDULE=0
# Tự bật "Đang họp" khi lịch Apple đang có sự kiện chứa chữ họp/meeting/call/zoom/teams
AUTO_MEET=0
# Điều khiển từ điện thoại (cùng Wi-Fi): 1 = bật máy chủ web nhỏ ở cổng REMOTE_PORT (Wi-Fi luôn mở)
REMOTE=0
REMOTE_PORT=8080
# Ngủ sâu ban đêm (thử nghiệm — dùng "Thử ngủ sâu 1 phút" trong Cài đặt trước): 1 = bật; dậy mỗi N phút
DEEP_SLEEP=0
DEEP_SLEEP_MIN=30
# ----- Đèn nền & ban đêm -----
# Đèn nền 0-24 (0 = tắt). Để trống = không đụng tới đèn.
LIGHT_DAY=8
LIGHT_NIGHT=1
# Giờ bắt đầu / kết thúc ban đêm (0-23)
NIGHT_START=22
NIGHT_END=6
# Ban đêm làm mới thưa hơn (phút)
REFRESH_NIGHT_MIN=10
# 1 = ban đêm đảo màu nền đen chữ trắng (thử nghiệm, có thể không chạy trên PW2)
NIGHT_INVERT=0

# ----- Hướng màn hình & tương tác -----
# doc = dọc. ngang = nằm ngang: CHƯA chạy đúng trên PW2 (màn hình bị lộn ngược), đừng bật.
ORIENTATION=doc
# Hướng xoay khi nằm ngang: 1 hoặc 3 (nếu chữ bị ngược thì đổi số còn lại)
ROTATE_LAND=1
# 1 = đảo toạ độ chạm khi nằm ngang (khi chạm bị lệch sang phía đối diện)
LAND_TOUCH_INVERT=0
# Sau N phút không chạm: lịch về tháng này, sự kiện về trang 1, thoát xem ảnh
IDLE_RESET_MIN=5

# ----- Cảm ứng (chỉnh nếu chạm nút Home không ăn; xem dashboard/touch.log) -----
TOUCH_MAX_X=758
TOUCH_MAX_Y=1024
TOUCH_SWAP_XY=0
TOUCH_FLIP_X=0
TOUCH_FLIP_Y=0

# Tự chỉnh giờ Kindle theo giờ chuẩn trên mạng (1 = bật), mỗi N phút
TIME_SYNC=1
TIME_SYNC_MIN=360

# Nháy đen toàn màn hình cho sạch bóng mờ e-ink: dem = 1 lần lúc 3 giờ sáng, số = mỗi N giờ, 0 = không
FULL_CLEAN=dem
# Khi nội dung đổi (thời tiết, ảnh, pin…): 1 = chỉ quét vùng đổi, 0 = quét toàn màn hình
DIFF_REFRESH=1
# Tối ưu pin mới (bản 18.03): pin đổi chỉ vẽ lại ô pin, đồng hồ chỉ vẽ lại chữ số đổi, bố cục không ảnh khỏi vẽ lại
# mỗi giờ, so vùng đổi bằng ít lệnh hơn. 0 = chạy y như bản 18.02 (cũng đổi được trong Cài đặt > Pin & đèn)
OPT_NEW=1
LOW_BATTERY=5
