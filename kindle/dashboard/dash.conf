# Địa chỉ server (máy Mac chạy dashboard_server.py, cùng mạng Wi-Fi)
SERVER_URL="http://192.168.1.10:8080/dashboard.png"
# Số phút giữa 2 lần làm mới
REFRESH_MIN=10
# Bao nhiêu lần làm mới thì full refresh 1 lần (xoá bóng mờ e-ink)
FULL_REFRESH_EVERY=6
# 1 = ngủ sâu giữa các lần làm mới (tiết kiệm pin, CHƯA thử trên máy thật). 0 = sleep thường.
DEEP_SLEEP=0
# RTC dùng để hẹn giờ thức dậy khi DEEP_SLEEP=1. Không chạy thì thử /dev/rtc0
RTC_DEV=/dev/rtc1
# Dưới mức pin này sẽ hiện cảnh báo sạc và dừng
LOW_BATTERY=5
